name: Generate profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - ".github/scripts/generate_profile_cards.py"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: KoeurngVireakk
        run: python .github/scripts/generate_profile_cards.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats-light.svg assets/profile-stats-dark.svg assets/top-languages-light.svg assets/top-languages-dark.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          git push
